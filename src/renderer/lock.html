<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .lock-container {
      text-align: center;
      max-width: 400px;
    }

    .lock-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ef5350;
    }

    .subtitle {
      font-size: 16px;
      color: #888;
      margin-bottom: 40px;
    }

    .pin-label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .pin-input {
      width: 200px;
      padding: 14px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .pin-input:focus {
      border-color: #5c6bc0;
    }

    .pin-input.error {
      border-color: #ef5350;
      animation: shake 0.4s ease;
    }

    .unlock-btn {
      display: block;
      margin: 20px auto 0;
      padding: 12px 40px;
      font-size: 16px;
      font-weight: 600;
      background: #5c6bc0;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .unlock-btn:hover {
      background: #7986cb;
    }

    .error-msg {
      margin-top: 16px;
      color: #ef5350;
      font-size: 14px;
      height: 20px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div class="lock-container">
    <div class="lock-icon">🔒</div>
    <h1>Session Expired</h1>
    <p class="subtitle">Your gaming session has ended.</p>

    <p class="pin-label">Admin PIN to unlock</p>
    <input
      id="pin"
      class="pin-input"
      type="password"
      maxlength="6"
      autofocus
      placeholder="••••"
    />
    <button id="unlock-btn" class="unlock-btn">Unlock</button>
    <p id="error" class="error-msg"></p>
  </div>

  <script>
    const pinInput = document.getElementById('pin');
    const unlockBtn = document.getElementById('unlock-btn');
    const errorEl = document.getElementById('error');

    async function tryUnlock() {
      const pin = pinInput.value;
      if (!pin) return;

      const result = await window.api.unlock(pin);
      if (result.success) {
        // Window will be destroyed by main process
      } else {
        pinInput.classList.add('error');
        errorEl.textContent = result.error || 'Wrong PIN';
        pinInput.value = '';
        setTimeout(() => pinInput.classList.remove('error'), 400);
      }
    }

    unlockBtn.addEventListener('click', tryUnlock);
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryUnlock();
    });
  </script>
</body>
</html>
